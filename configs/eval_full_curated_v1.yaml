# Detector evaluation on full_curated_v1
# Ultralytics YOLO + RT-DETR; optional GroundingDINO (see README).

dataset:
  name: full_curated_v1
  root: data/synthetic/full_curated_v1
  images_dir: data/synthetic/full_curated_v1/images
  labels_dir: data/synthetic/full_curated_v1/labels
  metadata_csv: data/synthetic/full_curated_v1/metadata.csv
  image_width: 640
  image_height: 640

evaluation:
  iou_thresholds: [0.25, 0.5]
  confidence_thresholds: [0.05, 0.10, 0.25, 0.50]
  primary_iou_threshold: 0.5
  tiny_object_iou_threshold: 0.25
  target_class_name: drone
  drone_class_id: 0
  drone_like_classes:
    - drone
    - quadcopter
    - unmanned aerial vehicle

outputs:
  root: outputs/evaluation/full_curated_v1

# Shared defaults for GroundingDINO model entry (merged into models.grounding_dino)
grounding_dino:
  repo_dir: external/GroundingDINO
  config_path: external/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py
  checkpoint_path: weights/groundingdino/groundingdino_swint_ogc.pth
  device: auto
  box_threshold: 0.20
  text_threshold: 0.20
  prompts:
    - drone
    - quadcopter
    - unmanned aerial vehicle
    - small drone in the sky

models:
  - name: yolo_latest
    type: ultralytics_yolo
    enabled: true
    weights: auto
    confidence: 0.05

  - name: rtdetr
    type: ultralytics_rtdetr
    enabled: true
    weights: auto
    confidence: 0.05

  - name: grounding_dino
    type: grounding_dino
    enabled: false
    weights: ""
    confidence: 0.05
    prompts:
      - drone
      - quadcopter
      - unmanned aerial vehicle
      - small drone in the sky
    box_threshold: 0.20
    text_threshold: 0.20
    repo_dir: external/GroundingDINO
    config_path: external/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py
    checkpoint_path: weights/groundingdino/groundingdino_swint_ogc.pth
    device: auto

  # Fine-tuned examples (enable after training — paths relative to project root)
  - name: yolo11n_drone_finetuned
    type: ultralytics_yolo
    enabled: false
    weights: outputs/training/yolo/yolo11n_drone_smoke_1epoch/weights/best.pt
    confidence: 0.05
    drone_like_classes: [drone]
    drone_class_id: 0

  - name: rtdetr_l_drone_finetuned
    type: ultralytics_rtdetr
    enabled: false
    weights: outputs/training/rtdetr/rtdetr_l_drone_smoke/weights/best.pt
    confidence: 0.05
    drone_like_classes: [drone]
    drone_class_id: 0
