# Final v1 synthetic stress-test configuration
# Drone-positive only — COCO hard negatives are merged at evaluation time, not here.
# See README.md — Final v1 synthetic dataset (§3b).

split: final_v1
seed: 42

input:
  # Prefer strict COCO sky pool (§2a-ix); short path fallback for Windows.
  backgrounds_dir: data/processed/backgrounds_coco_sky_strict
  backgrounds_dir_fallback: C:/datasets/coco2017/backgrounds_coco_sky_strict

  asset_source: processed

  raw:
    drones_dir: data/raw/drones
    distractors_dir: data/raw/distractors

  processed:
    # Best available SAM2 drone pool (update if your approved folder differs — see README §2a-ii).
    drones_dir: data/processed/assets_drone_birdvsdrone2
    drones_metadata_csv: data/processed/assets_drone_birdvsdrone2/asset_metadata.csv
    distractors_dir: data/processed/assets_distractors

output:
  images_dir: data/synthetic/final_v1/images
  labels_dir: data/synthetic/final_v1/labels
  metadata_csv: data/synthetic/final_v1/metadata.csv

generation:
  mode: drone_positive_synthetic
  num_images: 100
  #num_images: 1200
  image_width: 640
  image_height: 640
  background_sampling: balanced_by_type
  # Marginal balance: each level of size / noise / blur / background_type appears equally often.
  variable_sampling: balanced_marginals

variables:
  object_size_px: [8, 15, 30, 60]
  gaussian_noise_sigma: [0, 10, 20]
  blur_level: [none, mild]
  background_types:
    - clear_upper_sky
    - cloudy_sky
    - sky_with_natural_landscape
    - sky_with_built_environment

blur:
  none: 0
  mild: 3

classes:
  drone: 0

yolo:
  label_distractors: false

paste:
  sky_region_top_fraction: 0.75
  margin_px: 8

distance_bins:
  near: 60
  mid: 30
  far: 15
  very_far: 0

# Frozen COCO real hard negatives (evaluation only — not generated by this config):
#   C:\datasets\coco2017\hard_negatives_strict
#   subset=hard_negative_real, target_present=false, 220 images (bird 70, airplane 70, kite 80)
