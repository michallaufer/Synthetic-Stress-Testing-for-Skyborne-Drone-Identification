# Smoke-test synthetic dataset — final curated assets (Gemini drones + QA birds/airplanes)
# ~300 images across three synthetic subsets using the same background pool.
# See README.md — Final asset pack workflow.

split: smoke_curated_v2
seed: 42

input:
  asset_source: processed
  require_accept_label: true
  exclude_quality_labels: [reject, review]

  backgrounds_dir: data/processed/backgrounds_final/images
  backgrounds_dir_fallback: C:/datasets/backgrounds

  raw:
    drones_dir: data/raw/drones
    distractors_dir: data/raw/distractors

  processed:
    drones_dir: data/processed/assets_final/drones/images
    drones_metadata_csv: data/processed/assets_final/drones/asset_metadata_final.csv

    distractor_pools:
      bird:
        dir: data/processed/assets_final/birds/images
        metadata_csv: data/processed/assets_final/birds/asset_metadata_final.csv
      airplane:
        dir: data/processed/assets_final/airplanes/images
        metadata_csv: data/processed/assets_final/airplanes/asset_metadata_final.csv

output:
  images_dir: data/synthetic/smoke_curated_v2/images
  labels_dir: data/synthetic/smoke_curated_v2/labels
  metadata_csv: data/synthetic/smoke_curated_v2/metadata.csv

generation:
  mode: smoke_manual
  num_images: 300
  image_width: 640
  image_height: 640
  background_sampling: uniform_by_file
  variable_sampling: balanced_marginals
  subset_counts:
    synthetic_drone_positive: 100
    synthetic_distractor_only_bird: 50
    synthetic_distractor_only_airplane: 50
    synthetic_drone_plus_distractor_bird: 50
    synthetic_drone_plus_distractor_airplane: 50

variables:
  drone_size_px: [8, 15, 30, 60]
  bird_size_px: [8, 15, 30, 60]
  airplane_size_px: [15, 30, 60, 100]
  gaussian_noise_sigma: [0, 10, 20]
  blur_level: [none, mild]
  background_types:
    - unknown
  distractor_types:
    - bird
    - airplane

blur:
  none: 0
  mild: 3

classes:
  drone: 0

yolo:
  label_distractors: false

paste:
  sky_region_top_fraction: 0.75
  margin_px: 8

distance_bins:
  near: 60
  mid: 30
  far: 15
  very_far: 0
